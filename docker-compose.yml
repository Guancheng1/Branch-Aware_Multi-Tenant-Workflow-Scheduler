services:
  # Redis - for queue and cache
  redis:
    image: redis:7-alpine
    container_name: workflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - workflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application
  app:
    build: .
    container_name: workflow-app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_WORKERS=5
      - MAX_ACTIVE_USERS=3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DEVICE=cpu  # If GPU available, change to cuda
      - PYTHONUNBUFFERED=1  # Ensure print outputs immediately to logs
    volumes:
      # Data directories
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./logs:/app/logs
      - ./static:/app/static
      # Source code mount (development mode - no need to rebuild after code changes)
      - ./backend:/app/backend
      - ./main.py:/app/main.py
      - ./requirements.txt:/app/requirements.txt
    networks:
      - workflow-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Development mode: automatically restart after code changes (optional)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Prometheus - monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: workflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - workflow-network
    restart: unless-stopped

  # Grafana - visualization
  grafana:
    image: grafana/grafana:latest
    container_name: workflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - workflow-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  workflow-network:
    driver: bridge

